name: test

on:
  pull_request:
    branches:
      - main
      - next/*
  # Also run on pushes to main so the pnpm store cache is populated on the
  # default branch. GitHub only lets branches inherit caches created on the
  # default branch, so without this every PR branch starts with a cold cache
  # and re-downloads all dependencies from scratch.
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Path-based change detection with two outputs. `code` is true when anything
  # outside the ignore list below changed: meta files (agent instructions,
  # docs, license, .gitignore) cannot affect lint, packaging or test outcomes,
  # so a change touching only those skips the whole matrix. `create-cli` is
  # true when an input of the create-checkly e2e suite changed; only those
  # jobs are gated on it.
  #
  # The filter runs inside a job rather than as an `on: paths-ignore` trigger:
  # a workflow skipped by a trigger-level path filter never reports a status, so
  # required checks stay pending forever and block merge. The CI gates below
  # depend on this job, so if it fails, the gates fail rather than passing on a
  # matrix that never ran.
  # ---------------------------------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      create-cli: ${{ steps.create-cli-filter.outputs.create-cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # 'every' makes a file match `code` only when it matches *all* the
          # patterns, i.e. when it is none of the ignored paths. `code` is
          # therefore true when at least one changed file lives outside the
          # ignore list.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!.claude/**'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!CONTRIBUTING.md'
              - '!LICENSE'
              - '!README.md'
              - '!.gitignore'
      # Separate step because it needs the default 'some' quantifier: a file
      # matches `create-cli` when it matches *any* pattern. Selects the changes
      # that can affect the create-checkly e2e suite: the package itself, the
      # example templates it scaffolds from (the e2e runner points
      # CHECKLY_E2E_LOCAL_TEMPLATE_ROOT at the checked-out `examples/`), the
      # workspace-wide dependency/config files, and this workflow.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: create-cli-filter
        with:
          filters: |
            create-cli:
              - 'packages/create-cli/**'
              - 'examples/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/test.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Test that the packaging works as well
      - run: pnpm -r pack
      - run: pnpm run lint

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  test-ubuntu:
    name: test - ubuntu
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      # The lockfile-pruner tests exercising a real bun install skip themselves
      # when bun is not on PATH, so without this step they would silently never
      # run in CI. The version is pinned because the tests regenerate a
      # committed bun.lock fixture and a future bun may serialize it
      # differently.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      # Provisions a corepack-managed yarn for the real-yarn lockfile-pruner
      # tests (the fixture's packageManager field pins the exact Yarn Berry
      # version). Scoped to yarn on purpose: a bare `corepack enable` would
      # also shim pnpm into the setup-node bin dir, which precedes PNPM_HOME
      # in PATH and would silently replace the pinned pnpm for every later
      # step (this repo has no root packageManager field for corepack to
      # resolve).
      - run: corepack enable yarn
      # Downloads the fixture-pinned Yarn versions (Berry 4 and 3) now, so
      # a registry or corepack failure surfaces here with an obvious
      # message instead of inside the pruner's timed subprocess during the
      # test run. The env var suppresses corepack's download notice/prompt
      # as defense in depth (Actions has no TTY, so corepack would not
      # prompt anyway).
      - run: yarn --version
        working-directory: packages/cli/src/services/check-parser/__tests__/lockfile-pruner-fixtures/yarn-workspace
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: yarn --version
        working-directory: packages/cli/src/services/check-parser/__tests__/lockfile-pruner-fixtures/yarn3-workspace
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepack
      - run: pnpm run test
        env:
          # Makes the test suite assert that bun is actually on PATH, so a
          # lost setup-bun step fails loudly instead of silently skipping
          # the real-bun lockfile-pruner tests.
          CHECKLY_EXPECT_BUN: '1'
          # Same assertion for the corepack-managed Yarn Berry. The suite's
          # probe checks the resolved major version from the fixture
          # directory, so a preinstalled Classic yarn shadowing the corepack
          # shim fails the assertion rather than silently skipping the
          # real-yarn lockfile-pruner tests.
          CHECKLY_EXPECT_YARN: '1'
      - name: Save LLM rules as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-rules-test-ubuntu
          if-no-files-found: error
          path: packages/cli/dist/ai-context/*
          retention-days: 1
  test-windows:
    name: test - windows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      # See test-ubuntu: provisions bun for the real-bun lockfile-pruner tests,
      # which otherwise skip themselves.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      # See test-ubuntu: yarn-scoped so the corepack pnpm shim cannot shadow
      # the pinned pnpm, and pre-downloaded so a corepack failure surfaces
      # here instead of inside the timed pruner subprocess.
      - run: corepack enable yarn
      - run: yarn --version
        working-directory: packages/cli/src/services/check-parser/__tests__/lockfile-pruner-fixtures/yarn-workspace
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: yarn --version
        working-directory: packages/cli/src/services/check-parser/__tests__/lockfile-pruner-fixtures/yarn3-workspace
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepack
      - run: pnpm run test
        env:
          # See test-ubuntu.
          CHECKLY_EXPECT_BUN: '1'
          CHECKLY_EXPECT_YARN: '1'
      - name: Save LLM rules as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-rules-test-windows
          if-no-files-found: error
          path: packages/cli/dist/ai-context/*
          retention-days: 1

  # ---------------------------------------------------------------------------
  # checkly e2e — hits the live Checkly API (PRs only). Windows is sharded
  # because it is the slow leg; Ubuntu runs the whole suite in one job.
  # ---------------------------------------------------------------------------
  test-e2e-checkly-ubuntu:
    name: e2e - checkly - ubuntu
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepack
      - run: pnpm --filter checkly run test:e2e
        env:
          CHECKLY_ACCOUNT_NAME: ${{ secrets.E2E_CHECKLY_ACCOUNT_NAME }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.E2E_CHECKLY_ACCOUNT_ID }}
          CHECKLY_API_KEY: ${{ secrets.E2E_CHECKLY_API_KEY }}
          CHECKLY_EMPTY_ACCOUNT_ID: ${{ secrets.E2E_EMPTY_CHECKLY_ACCOUNT_ID }}
          CHECKLY_EMPTY_API_KEY: ${{ secrets.E2E_EMPTY_CHECKLY_API_KEY }}
  test-e2e-checkly-windows:
    name: e2e - checkly - windows (${{ matrix.shard }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepack
      # Deliberately no `--` separator: pnpm appends trailing args to the
      # script command as-is, so --shard reaches vitest without one. Unlike
      # npm, pnpm forwards a literal `--` verbatim into the script, where
      # vitest's parser collects everything after it into an argument list it
      # never reads — silently discarding --shard. The suite still passes when
      # that happens, so a green run is not evidence the flag landed; check
      # that each shard reports fewer test files than the full suite and that
      # the four counts sum to it.
      - run: pnpm --filter checkly run test:e2e --shard=${{ matrix.shard }}
        env:
          CHECKLY_ACCOUNT_NAME: ${{ secrets.E2E_CHECKLY_ACCOUNT_NAME }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.E2E_CHECKLY_ACCOUNT_ID }}
          CHECKLY_API_KEY: ${{ secrets.E2E_CHECKLY_API_KEY }}
          CHECKLY_EMPTY_ACCOUNT_ID: ${{ secrets.E2E_EMPTY_CHECKLY_ACCOUNT_ID }}
          CHECKLY_EMPTY_API_KEY: ${{ secrets.E2E_EMPTY_CHECKLY_API_KEY }}

  # ---------------------------------------------------------------------------
  # create-checkly e2e (PRs only, and only when the suite's inputs changed)
  #
  # The suite is slow enough to hold up the CI gates, so it runs only for PRs
  # that touch something it depends on (see the `create-cli` filter in the
  # `changes` job). Unrelated PRs skip it; a skipped job counts as success in
  # the gates below, so the `needs:` wiring stays intact.
  # ---------------------------------------------------------------------------
  test-e2e-create-checkly-ubuntu:
    name: e2e - create-checkly - ubuntu
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.create-cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-checkly run test:e2e
  test-e2e-create-checkly-windows:
    name: e2e - create-checkly - windows
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.create-cli == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-checkly run test:e2e

  # ---------------------------------------------------------------------------
  # Gates — one aggregate status check per OS. These are the jobs to require in
  # branch protection: a single check for Windows (which fans out into 4 e2e
  # shards) and a single check for Ubuntu, so Windows can be made non-required
  # independently of Ubuntu without touching individual job names.
  # ---------------------------------------------------------------------------
  gate-ubuntu:
    name: CI gate - ubuntu
    if: always()
    needs:
      - changes
      - lint
      - test-ubuntu
      - test-e2e-checkly-ubuntu
      - test-e2e-create-checkly-ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Ubuntu jobs succeeded
        run: |
          results="${{ join(needs.*.result, ', ') }}"
          echo "Ubuntu job results: $results"
          # 'skipped' is allowed (e2e jobs are skipped on push-to-main, and
          # every job is skipped for meta-file-only changes); only
          # 'failure'/'cancelled' should fail the gate. `changes` is a
          # dependency so that a failure to compute the path filter fails the
          # gate instead of green-lighting a matrix that never ran.
          if [[ "$results" == *failure* || "$results" == *cancelled* ]]; then
            echo "::error::One or more Ubuntu jobs did not succeed"
            exit 1
          fi
  gate-windows:
    name: CI gate - windows
    if: always()
    needs:
      - changes
      - test-windows
      - test-e2e-checkly-windows
      - test-e2e-create-checkly-windows
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Windows jobs succeeded
        run: |
          results="${{ join(needs.*.result, ', ') }}"
          echo "Windows job results: $results"
          if [[ "$results" == *failure* || "$results" == *cancelled* ]]; then
            echo "::error::One or more Windows jobs did not succeed"
            exit 1
          fi
